<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수동 모드</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            text-align: center;
        }

        .card {
            max-width: 90%;
            margin: 40px auto;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            background-color: white;
        }

        .content-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .camera-container {
            width: 48%; /* 카메라 컨테이너 너비 */
            padding: 0 10px;
        }

        .sensor-container {
            width: 48%; /* 센서 컨테이너 너비 */
            padding: 0 10px;
        }

        .section, .section2 {
            margin-bottom: 20px;
            padding: 15px 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
        }

        .toggle-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .toggle-label {
            flex: 1;
            text-align: center;
            margin: 10px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .toggle-switch input {
            display: none;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #007bff;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 16px;
        }

        .button:hover {
            background-color: #0056b3;
        }

        .sensor-data {
            width: 100%;
            margin-top: 20px;
        }

        .sensor-item {
            display: inline-block;
            width: 45%;
            background-color: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            margin: 10px 0;
            box-sizing: border-box;
        }

        .sensor-item h3 {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
        }

        .sensor-item p {
            font-size: 18px;
            margin: 5px 0;
            font-weight: normal;
            color: #333;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .content-row {
                flex-direction: column;
            }
            .camera-container, .sensor-container {
                width: 100%;
            }
        }
    </style>

    <script>
        function fetchSensorData() {
            $.getJSON('/sensor_data', function(data) {
                $('#temperature').text(data.temperature);
                $('#humidity').text(data.humidity);
                $('#soil_moisture_status').text(getSoilMoistureStatus(data.soil_moisture));
                $('#water_status').text(getWaterLevelStatus(data.water_level));
            }).fail(function() {
                console.error("센서 데이터 요청 실패");
            });
        }

        function getSoilMoistureStatus(moisture) {
            if (moisture < 200) {
                return "수분 부족";
            } else if (moisture < 500) {
                return "수분 중간";
            } else {
                return "수분 충분";
            }
        }

        function getWaterLevelStatus(level) {
            if (level < 400) {
                return "수위 낮음";
            } else if (level < 700) {
                return "수위 중간";
            } else {
                return "수위 높음";
            }
        }

        $(document).ready(function() {
            fetchSensorData(); // 초기 데이터 가져오기
            setInterval(fetchSensorData, 1000); // 1초마다 데이터 가져오기

            // 슬라이더 클릭 이벤트 핸들러
            $('input[name="pump"]').change(function() {
                let action = $(this).prop('checked') ? 'on' : 'off';
                $.post('/manual', { pump: action }, function(response) {
                    console.log("펌프 상태 변경:", action);
                });
            });

            $('input[name="fan"]').change(function() {
                let action = $(this).prop('checked') ? 'on' : 'off';
                $.post('/manual', { fan: action }, function(response) {
                    console.log("팬 상태 변경:", action);
                });
            });

            $('input[name="window"]').change(function() {
                let action = $(this).prop('checked') ? 'open' : 'close';
                $.post('/manual', { window: action }, function(response) {
                    console.log("창문 상태 변경:", action);
                });
            });

            $('input[name="led"]').change(function() {
                let action = $(this).prop('checked') ? 'on' : 'off';
                $.post('/manual', { led: action }, function(response) {
                    console.log("LED 상태 변경:", action);
                });
            });
        });
    </script>
</head>

<body>
    <div class="card">
        <h1>수동 모드 제어</h1>
        <div class="content-row">
            <div class="camera-container">
                <div class="section">
                    <h2>농장 카메라</h2>
                    <img src="http://172.16.200.109:8000/?action=stream" alt="농장 비디오 스트림" style="width: 100%; height: auto; border-radius: 5px;">
                </div>
            </div>
            <div class="sensor-container">
                <div class="section2">
                    <h2>센서 제어</h2>
                    <div class="toggle-row">
                        <div class="toggle-label">
                            <h3>워터펌프</h3>
                            <label class="toggle-switch">
                                <input type="checkbox" name="pump">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="toggle-label">
                            <h3>쿨링팬</h3>
                            <label class="toggle-switch">
                                <input type="checkbox" name="fan">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="toggle-label">
                            <h3>창문</h3>
                            <label class="toggle-switch">
                                <input type="checkbox" name="window">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="toggle-label">
                            <h3>LED</h3>
                            <label class="toggle-switch">
                                <input type="checkbox" name="led">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="sensor-data">
                    <div class="section">
                        <h2>농장 상태</h2>
                        <div class="sensor-row">
                            <div class="sensor-item">
                                <h3>온도</h3>
                                <p><span id="temperature">-</span> °C</p>
                            </div>
                            <div class="sensor-item">
                                <h3>습도</h3>
                                <p><span id="humidity">-</span> %</p>
                            </div>
                        </div>
                        <div class="sensor-row">
                            <div class="sensor-item">
                                <h3>토양 수분</h3>
                                <p><span id="soil_moisture_status">-</span></p>
                            </div>
                            <div class="sensor-item">
                                <h3>수위 상태</h3>
                                <p><span id="water_status">-</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="button-row">
            <button class="button" onclick="window.location.href='/auto'">자동 모드로 이동</button>
            <button class="button" onclick="window.location.href='/'">메인페이지로 이동</button>
        </div>
    </div>
</body>
</html>
